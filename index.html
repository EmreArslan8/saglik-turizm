<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NovaMed — Sağlık Turizmi İstanbul (Demo)</title>
  <meta name="description" content="NovaMed İstanbul: saç ekimi, diş estetiği, burun estetiği, lazer göz ve obezite cerrahisi. Her şey dahil sağlık turizmi paketleri." />
  <meta name="theme-color" content="#0b6e6e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="demo-bar" data-i18n="ft.demo"></div>

  <header class="header" id="top">
    <div class="container header__inner">
      <a href="#top" class="logo"><span class="logo__mark">+</span>Nova<b>Med</b></a>
      <nav class="nav" id="nav">
        <a href="#treatments" data-i18n="nav.treatments"></a>
        <a href="#packages" data-i18n="nav.packages"></a>
        <a href="#doctors" data-i18n="nav.doctors"></a>
        <a href="#reviews" data-i18n="nav.reviews"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
      </nav>
      <div class="header__actions">
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="tr">TR</button>
          <button data-lang="en">EN</button>
          <button data-lang="ar">ع</button>
        </div>
        <a href="#appointment" class="btn btn--primary btn--sm hide-sm" data-i18n="nav.cta"></a>
        <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="hero">
    <img class="hero__bg" id="heroImg" alt="" />
    <div class="hero__overlay"></div>
    <div class="container hero__inner">
      <div class="hero__text">
        <span class="badge" data-i18n="hero.badge"></span>
        <h1 data-i18n-html="hero.title"></h1>
        <p data-i18n="hero.sub"></p>
        <div class="hero__ctas">
          <a href="#appointment" class="btn btn--primary" data-i18n="hero.cta1"></a>
          <a href="#" class="btn btn--wa js-wa"><svg class="ico"><use href="#wa"/></svg><span data-i18n="hero.cta2"></span></a>
        </div>
      </div>
      <form class="quick card" id="quickForm" novalidate>
        <h3 data-i18n="quick.title"></h3>
        <select name="treatment" class="js-treatment-select" required></select>
        <input name="phone" type="tel" required data-i18n-ph="quick.phone" />
        <button class="btn btn--primary btn--block" data-i18n="quick.send"></button>
      </form>
    </div>
  </section>

  <section class="stats">
    <div class="container stats__grid">
      <div><b data-count="12000">0</b>+<span data-i18n="stats.patients"></span></div>
      <div><b data-count="65">0</b>+<span data-i18n="stats.countries"></span></div>
      <div><b data-count="40">0</b>+<span data-i18n="stats.doctors"></span></div>
      <div><b>4.9</b>/5<span data-i18n="stats.rating"></span></div>
    </div>
  </section>

  <section class="section" id="treatments">
    <div class="container">
      <div class="section__head"><span class="kicker" data-i18n="tr.kicker"></span><h2 data-i18n="tr.title"></h2></div>
      <div class="grid grid--3" id="treatmentGrid"></div>
    </div>
  </section>

  <section class="section section--tint">
    <div class="container">
      <div class="section__head"><span class="kicker" data-i18n="how.kicker"></span><h2 data-i18n="how.title"></h2></div>
      <ol class="steps">
        <li><i>💬</i><h4 data-i18n="how.1t"></h4><p data-i18n="how.1d"></p></li>
        <li><i>📋</i><h4 data-i18n="how.2t"></h4><p data-i18n="how.2d"></p></li>
        <li><i>✈️</i><h4 data-i18n="how.3t"></h4><p data-i18n="how.3d"></p></li>
        <li><i>🏥</i><h4 data-i18n="how.4t"></h4><p data-i18n="how.4d"></p></li>
        <li><i>🏡</i><h4 data-i18n="how.5t"></h4><p data-i18n="how.5d"></p></li>
      </ol>
    </div>
  </section>

  <section class="section" id="packages">
    <div class="container">
      <div class="section__head"><span class="kicker" data-i18n="pk.kicker"></span><h2 data-i18n="pk.title"></h2></div>
      <div class="grid grid--3 packages" id="packageGrid"></div>
    </div>
  </section>

  <section class="section section--tint" id="doctors">
    <div class="container">
      <div class="section__head"><span class="kicker" data-i18n="dr.kicker"></span><h2 data-i18n="dr.title"></h2></div>
      <div class="grid grid--4" id="doctorGrid"></div>
    </div>
  </section>

  <section class="section" id="reviews">
    <div class="container">
      <div class="section__head"><span class="kicker" data-i18n="rv.kicker"></span><h2 data-i18n="rv.title"></h2></div>
      <div class="reviews" id="reviewGrid"></div>
      <div class="accred">
        <p data-i18n="acc.title"></p>
        <div class="accred__logos"><span>JCI</span><span>ISO 9001</span><span>ISAPS</span><span>T.C. Sağlık Bakanlığı</span><span>USHAŞ</span></div>
      </div>
    </div>
  </section>

  <section class="section section--tint" id="faq">
    <div class="container container--narrow">
      <div class="section__head"><span class="kicker" data-i18n="faq.kicker"></span><h2 data-i18n="faq.title"></h2></div>
      <div class="faq" id="faqList"></div>
    </div>
  </section>

  <section class="section" id="appointment">
    <div class="container appt">
      <div class="appt__info">
        <span class="kicker" data-i18n="form.kicker"></span>
        <h2 data-i18n="form.title"></h2>
        <p data-i18n="form.sub"></p>
        <img id="aboutImg" class="appt__img" alt="" />
        <ul class="contact">
          <li>📞 <a href="#" id="ctPhone"></a> <small data-i18n="ct.hours"></small></li>
          <li>✉️ <a href="#" id="ctMail"></a></li>
          <li>📍 <span id="ctAddr"></span></li>
        </ul>
      </div>
      <form class="card form" id="apptForm" novalidate>
        <div class="row">
          <label><span data-i18n="form.name"></span> *<input name="name" required autocomplete="name" /></label>
          <label><span data-i18n="form.phone"></span> *<input name="phone" type="tel" required autocomplete="tel" placeholder="+44 7700 900000" /></label>
        </div>
        <div class="row">
          <label><span data-i18n="form.email"></span><input name="email" type="email" autocomplete="email" /></label>
          <label><span data-i18n="form.country"></span><input name="country" autocomplete="country-name" /></label>
        </div>
        <div class="row">
          <label><span data-i18n="form.treatment"></span> *<select name="treatment" class="js-treatment-select" required></select></label>
          <label><span data-i18n="form.date"></span><input name="date" type="date" /></label>
        </div>
        <label><span data-i18n="form.msg"></span><textarea name="message" rows="3"></textarea></label>
        <label class="check"><input type="checkbox" name="consent" required /> <span data-i18n="form.consent"></span></label>
        <p class="form__err" id="formErr" data-i18n="form.err" hidden></p>
        <button class="btn btn--primary btn--block" data-i18n="form.submit"></button>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container footer__inner">
      <a href="#top" class="logo logo--light"><span class="logo__mark">+</span>Nova<b>Med</b></a>
      <p>© <span id="year"></span> NovaMed Health Tourism. <span data-i18n="ft.rights"></span></p>
      <p class="muted" data-i18n="ft.demo"></p>
    </div>
  </footer>

  <a href="#" class="wa-float js-wa" aria-label="WhatsApp">
    <span class="wa-float__tip" data-i18n="wa.tip"></span>
    <svg class="ico"><use href="#wa"/></svg>
  </a>

  <div class="modal" id="okModal" hidden>
    <div class="modal__box card">
      <div class="modal__icon">✓</div>
      <h3 data-i18n="form.okT"></h3>
      <p data-i18n="form.okD"></p>
      <a href="#" class="btn btn--wa btn--block" id="okWa"><svg class="ico"><use href="#wa"/></svg><span data-i18n="form.okWa"></span></a>
      <button class="btn btn--ghost btn--block" id="okClose" data-i18n="form.close"></button>
    </div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.79-1.47-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.5h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.27.49 1.7.63.72.23 1.37.2 1.88.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.8h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.9-9.88a9.83 9.83 0 0 1 9.88 9.89c0 5.45-4.44 9.88-9.89 9.88m8.41-18.3A11.81 11.81 0 0 0 12.05 0C5.5 0 .16 5.33.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.17-1.24-6.16-3.48-8.4"/></symbol>
  </svg>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
